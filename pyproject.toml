[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "foreman"
dynamic = ["version"]
description = "Foreman: provider-agnostic orchestrator for AI coding sessions across related projects"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX",
]
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0"
]

[project.scripts]
foreman = "orchestrator.cli:main"
orchestrator = "orchestrator.cli:main"  # earlier command name, kept as an alias

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestrator = ["modes/*.md"]

[tool.setuptools.dynamic]
version = { attr = "orchestrator.__version__" }

[tool.ruff]
target-version = "py39"
line-length = 160
src = ["src", "tests"]

[tool.ruff.lint]
# Correctness only (syntax errors, undefined names, unused imports/variables); style is left to the surrounding code.
select = ["E9", "F"]
