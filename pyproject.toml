[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "orchestrator"
version = "0.2.0"
description = "Foreman: provider-agnostic orchestrator for AI coding sessions across related projects"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0"
]

[project.scripts]
orchestrator = "orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
