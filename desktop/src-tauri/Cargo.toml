[package]
name = "foreman-desktop"
version = "0.1.0"
description = "Foreman's desktop app: a window over `foreman serve --stdio`"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
